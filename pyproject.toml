[project]
name = "gitcap"
version = "0.2.0"
description = "Commit messages from the coding agent you are already logged in to (Claude Code, Codex, Gemini, Grok, ...) or Groq."
readme = "README.md"
authors = [
    { name = "wiseman-umanah", email = "wisemanumanah@gmail.com" }
]
requires-python = ">=3.11,<3.14"
keywords = ["git", "commit", "ai", "groq", "claude-code", "codex", "gemini-cli", "grok", "conventional-commits"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "readchar>=4.2.0",
    "rich>=13.9.4",
]

[project.urls]
Homepage = "https://github.com/wiseman-umanah/GitCap.git"
Repository = "https://github.com/wiseman-umanah/GitCap.git"


[project.scripts]
gitcap = "gitcap.cli:main"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
