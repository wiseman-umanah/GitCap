[project]
name = "gitcap"
version = "0.1.0"
description = "AI-powered git commit message generator."
readme = "README.md"
authors = [
    { name = "wiseman-umanah", email = "wisemanumanah@gmail.com" }
]
requires-python = ">=3.11,<3.14"
keywords = ["git", "commit", "ai", "groq", "openai", "claude", "conventional-commits"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "anthropic>=0.40.0",
    "gitpython>=3.1.43",
    "groq>=0.11.0",
    "openai>=1.55.0",
    "platformdirs>=4.3.6",
    "pyfiglet>=1.0.2",
    "readchar>=4.2.0",
    "requests>=2.32.3",
    "rich>=13.9.4",
]

[project.urls]
Homepage = "https://github.com/wiseman-umanah/GitCap.git"
Repository = "https://github.com/wiseman-umanah/GitCap.git"


[project.scripts]
gitcap = "gitcap:main"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"
