name: Release

# Every push to master updates a release PR (version bump + CHANGELOG from Conventional Commits).
# Merging that PR tags the release, creates the GitHub release, runs CI and publishes to PyPI,
# all in this one run. A tag created with the workflow's own token can't trigger another workflow,
# and PyPI trusted publishing is tied to this file name, so everything lives here.
# Pushing a v* tag by hand still publishes too.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, GitHub releases, the release branch
      pull-requests: write # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ci:
    name: CI
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [release-please, ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v6

      - name: Check tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          code=$(grep -m1 '^__version__' src/gitcap/__init__.py | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ] || [ "$code" != "$version" ]; then
            echo "::error::Tag $TAG, pyproject $version and __version__ $code must all match"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
